litellm_settings:
  # अगर कोई API Key एरर देती है (जैसे 429 Rate Limit), 
  # तो बैकएंड में यह बिना Aider को क्रैश किए 3 बार दूसरी keys के साथ रिट्राई करेगा।
  num_retries: 3 

router_settings:
  # यह लोड को सभी keys में डिस्ट्रीब्यूट करेगा।
  # इससे कोई एक key जल्दी एग्जॉस्ट (exhaust) नहीं होगी।
  routing_strategy: simple-shuffle 
